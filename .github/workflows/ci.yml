name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Node.js 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: Practical-12/backend/package-lock.json

      - name: Install dependencies
        working-directory: Practical-12/backend
        run: npm install

      - name: Run automated tests
        working-directory: Practical-12/backend
        run: npm test
